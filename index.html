<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chausar AI — Coming Soon</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 37 37'%3E%3Crect x='0' y='0' width='18' height='18' rx='4.5' fill='%23343C2B'/%3E%3Crect x='19' y='19' width='18' height='18' rx='4.5' fill='%23A8833B'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500&family=IBM+Plex+Mono:wght@400&display=swap" rel="stylesheet">
  <style>
    :root {
      --white:  #FFFFFF;
      --banyan: #343C2B;
      --peepal: #262C1F;
      --lichen: #4D5440;
      --brass:  #A8833B;
      --sage:   #A9B393;
      --sans: 'Figtree', system-ui, sans-serif;
      --mono: 'IBM Plex Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    .page {
      position: relative;
      min-height: 100vh;
      background: var(--white);
      font-family: var(--sans);
      color: var(--peepal);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 64px;
    }
    .page > * { position: relative; z-index: 1; }
    #rain { position: absolute; inset: 0; z-index: 0; pointer-events: none; }
    .lockup { display: inline-flex; align-items: center; gap: 0.62em; margin-top: 8px; }
    .wordmark { font-family: var(--sans); font-weight: 500; color: var(--banyan); letter-spacing: -0.012em; line-height: 1; font-size: 26px; }
    .center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
    .headline { font-family: var(--sans); font-weight: 500; color: var(--banyan); letter-spacing: -0.022em; line-height: 1.04; text-wrap: balance; margin: 0; font-size: 58px; max-width: 720px; }
    .status { font-family: var(--mono); font-weight: 400; color: var(--lichen); font-size: 13px; letter-spacing: 0.01em; margin: 22px 0 0; }
    .note { font-family: var(--sans); font-weight: 400; color: var(--lichen); font-size: 16px; line-height: 1.5; margin: 0 0 18px; max-width: 440px; }
    .capture { display: flex; align-items: stretch; gap: 10px; justify-content: center; }
    .capture input[type="email"] {
      font-family: var(--sans); font-weight: 400; font-size: 16px; color: var(--peepal);
      background: var(--white); border: 1px solid var(--sage); border-radius: 7px;
      padding: 0 16px; height: 46px; width: 320px; outline: none;
      transition: border-color 0.16s ease, box-shadow 0.16s ease;
    }
    .capture input[type="email"]::placeholder { color: var(--lichen); opacity: 0.62; }
    .capture input[type="email"]:focus { border-color: var(--banyan); box-shadow: 0 0 0 3px rgba(169,179,147,0.28); }
    .capture button {
      font-family: var(--sans); font-weight: 500; font-size: 15px; letter-spacing: 0.005em;
      color: var(--white); background: var(--brass); border: none; border-radius: 7px;
      padding: 0 22px; height: 46px; cursor: pointer; flex: 0 0 auto; white-space: nowrap;
      transition: background-color 0.16s ease, opacity 0.16s ease;
    }
    .capture button:hover { background: #97712f; }
    .capture button:disabled { opacity: 0.55; cursor: default; }
    .capture-msg { font-family: var(--mono); font-size: 13px; letter-spacing: 0.01em; margin-top: 14px; min-height: 20px; }
    .capture-msg.success { color: var(--banyan); }
    .capture-msg.error   { color: #9b3030; }
    footer { display: flex; flex-direction: column; align-items: center; gap: 22px; }
    .epigraph { font-family: var(--sans); font-weight: 500; color: var(--lichen); font-size: 14.5px; line-height: 1.55; margin: 0; max-width: 380px; text-wrap: pretty; text-align: center; }
    .contacts { display: grid; grid-template-columns: auto auto; column-gap: 16px; row-gap: 8px; }
    .contact-label { font-family: var(--mono); font-weight: 400; font-size: 12.5px; color: #828772; letter-spacing: 0.01em; white-space: nowrap; }
    .contact-email { font-family: var(--mono); font-weight: 400; font-size: 12.5px; color: var(--lichen); text-decoration: none; border-bottom: 1px solid rgba(169,179,147,0.5); padding-bottom: 1px; width: fit-content; transition: border-color 0.15s ease, color 0.15s ease; }
    .contact-email:hover { color: var(--banyan); border-bottom-color: var(--banyan); }
    .copyright { font-family: var(--mono); font-weight: 400; color: var(--lichen); font-size: 12px; letter-spacing: 0.01em; margin: 0; }
    @media (max-width: 640px) {
      .page { padding: 40px 24px; }
      .headline { font-size: 36px; }
      .capture { flex-direction: column; align-items: stretch; width: 100%; max-width: 360px; }
      .capture input[type="email"] { width: 100%; }
      .capture button { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="page">
    <canvas id="rain" aria-hidden="true"></canvas>
    <header class="lockup">
      <svg viewBox="0 0 37 37" width="28" height="28" aria-hidden="true">
        <rect x="0" y="0" width="18" height="18" rx="4.5" fill="#343C2B"></rect>
        <rect x="19" y="19" width="18" height="18" rx="4.5" fill="#A8833B"></rect>
      </svg>
      <span class="wordmark">Chausar</span>
    </header>
    <div class="center">
      <h1 class="headline">Decision intelligence for organisations</h1>
      <p class="status">Built in India &middot; 2026</p>
      <div style="margin-top:60px;display:flex;flex-direction:column;align-items:center;">
        <p class="note">Leave an email. We'll write when there's something to show.</p>
        <form class="capture" id="signup-form">
          <input type="email" name="email" placeholder="you@organisation.com" required autocomplete="email">
          <button type="submit" id="signup-btn">Notify me</button>
        </form>
        <p class="capture-msg" id="capture-msg" aria-live="polite"></p>
      </div>
    </div>
    <footer>
      <p class="epigraph">A kingdom, lost over dice. The lesson outlived the kingdom.</p>
      <div class="contacts">
        <span class="contact-label">Career enquiries</span>
        <a class="contact-email" href="mailto:careers@chausar.co.in">careers@chausar.co.in</a>
        <span class="contact-label">Business enquiries</span>
        <a class="contact-email" href="mailto:info@chausar.co.in">info@chausar.co.in</a>
      </div>
      <p class="copyright">chausar.co.in</p>
    </footer>
  </div>
  <script>
    (function () {
      var ENDPOINT = 'https://formspree.io/f/FORMSPREE_ID';
      var form = document.getElementById('signup-form');
      var btn  = document.getElementById('signup-btn');
      var msg  = document.getElementById('capture-msg');
      form.addEventListener('submit', function (e) {
        e.preventDefault();
        btn.disabled = true;
        btn.textContent = 'Sending...';
        msg.textContent = '';
        msg.className = 'capture-msg';
        fetch(ENDPOINT, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        })
        .then(function (res) {
          if (res.ok) {
            form.reset();
            btn.textContent = 'Done';
            msg.textContent = "You're on the list.";
            msg.className = 'capture-msg success';
          } else {
            return res.json().then(function (json) {
              throw new Error(json.errors ? json.errors.map(function(e){return e.message;}).join(', ') : 'failed');
            });
          }
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = 'Notify me';
          msg.textContent = 'Something went wrong. Try again.';
          msg.className = 'capture-msg error';
        });
      });
    })();
    (function () {
      var canvas = document.getElementById('rain');
      var parent = canvas.parentElement;
      var ctx    = canvas.getContext('2d');
      var dpr    = Math.min(window.devicePixelRatio || 1, 2);
      var fontSize = 15;
      var w, h, cols, drops, speed, colAlpha;
      function setup() {
        w = parent.clientWidth; h = parent.clientHeight;
        canvas.width  = w * dpr; canvas.height = h * dpr;
        canvas.style.width  = w + 'px'; canvas.style.height = h + 'px';
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        cols = Math.ceil(w / fontSize);
        drops = []; speed = []; colAlpha = [];
        for (var i = 0; i < cols; i++) {
          drops[i]    = Math.random() * -(h / fontSize);
          speed[i]    = 0.55 + Math.random() * 0.7;
          colAlpha[i] = 0.35 + Math.pow(Math.random(), 1.7) * 0.65;
        }
      }
      setup();
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
        ctx.font = '400 ' + fontSize + "px 'IBM Plex Mono', monospace";
        ctx.textBaseline = 'top';
        for (var i = 0; i < cols; i++) {
          for (var r = 0; r < h / fontSize; r++) {
            if (Math.random() < 0.18) {
              ctx.fillStyle = 'rgba(169,179,147,' + (0.05 + 0.08 * colAlpha[i]).toFixed(3) + ')';
              ctx.fillText(Math.random() < 0.5 ? '0' : '1', i * fontSize, r * fontSize);
            }
          }
        }
        return;
      }
      var last = 0, stepMs = 60;
      function draw(t) {
        requestAnimationFrame(draw);
        if (t - last < stepMs) return;
        last = t;
        ctx.fillStyle = 'rgba(255,255,255,0.16)';
        ctx.fillRect(0, 0, w, h);
        ctx.font = '400 ' + fontSize + "px 'IBM Plex Mono', monospace";
        ctx.textBaseline = 'top';
        for (var i = 0; i < cols; i++) {
          var a = (0.08 + 0.30 * colAlpha[i]).toFixed(3);
          ctx.fillStyle = 'rgba(169,179,147,' + a + ')';
          ctx.fillText(Math.random() < 0.5 ? '0' : '1', i * fontSize, drops[i] * fontSize);
          if (drops[i] * fontSize > h && Math.random() > 0.97) {
            drops[i] = Math.random() * -6;
            speed[i] = 0.55 + Math.random() * 0.7;
          }
          drops[i] += speed[i];
        }
      }
      requestAnimationFrame(draw);
      window.addEventListener('resize', setup);
    })();
  </script>
</body>
</html>
