<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chausar AI: decision intelligence for organisations</title>
<meta name="description" content="Chausar AI. Decision intelligence for organisations. Built in India.">
<meta name="theme-color" content="#070809">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 44 44'%3E%3Crect width='44' height='44' rx='10' fill='%23070809'/%3E%3Cg transform='translate(3.5,3.5)'%3E%3Crect x='0' y='0' width='18' height='18' rx='4.5' fill='%23E8EBEE'/%3E%3Crect x='19' y='19' width='18' height='18' rx='4.5' fill='%2346F09B'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --court: #070809;
    --panel: #0B0E10;
    --hair:  #171B1F;
    --hair2: #232A2F;
    --phos:  #46F09B;
    --fog:   #E8EBEE;
    --mist:  #8B9197;
    --dim:   #5E6660;
    --error: #E24B4A;
    --sans: 'Inter', ui-sans-serif, system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: var(--sans);
    font-weight: 400;
    color: var(--fog);
    background: var(--court);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
  }
  ::selection { background: rgba(70,240,155,0.22); color: var(--fog); }
  main {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 48px 28px;
  }
  .lock { display: flex; align-items: center; gap: 11px; margin-bottom: 64px; }
  .lock svg { display: block; }
  .lock span { font-family: var(--mono); font-weight: 500; font-size: 17px; color: var(--fog); }
  h1 {
    font-weight: 600;
    font-size: clamp(1.9rem, 5.2vw, 2.75rem);
    line-height: 1.12;
    letter-spacing: -0.025em;
    color: var(--fog);
    margin-bottom: 22px;
  }
  .myth {
    font-family: var(--mono);
    font-size: 0.95rem;
    line-height: 1.6;
    color: var(--mist);
    max-width: 46ch;
    margin-bottom: 30px;
  }
  .status {
    font-family: var(--mono);
    font-size: 0.8125rem;
    color: var(--mist);
    margin-bottom: 48px;
  }
  .status .dot { color: var(--phos); padding: 0 0.55em; }
  .field-note { font-size: 0.95rem; color: var(--mist); margin-bottom: 14px; }
  form { display: flex; gap: 10px; flex-wrap: wrap; max-width: 460px; }
  input[type="email"] {
    flex: 1 1 230px;
    font-family: var(--sans);
    font-size: 1rem;
    padding: 12px 15px;
    border: 0.5px solid var(--hair2);
    border-radius: 8px;
    color: var(--fog);
    background: var(--panel);
    outline: none;
    transition: border-color .2s ease;
  }
  input[type="email"]:focus { border-color: var(--phos); }
  input[type="email"]::placeholder { color: var(--dim); }
  button {
    font-family: var(--sans);
    font-weight: 500;
    font-size: 1rem;
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    background: var(--phos);
    color: var(--court);
    cursor: pointer;
    transition: transform .15s ease, opacity .2s ease;
  }
  button:hover { transform: translateY(-1px); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: 0.55; cursor: default; transform: none; }
  .form-msg { font-family: var(--mono); font-size: 0.8125rem; margin-top: 14px; color: var(--phos); min-height: 1.4em; }
  .form-msg.error { color: var(--error); }
  footer {
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
    padding: 24px 28px;
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--dim);
    border-top: 0.5px solid var(--hair);
    display: flex;
    flex-wrap: wrap;
    gap: 6px 20px;
    justify-content: space-between;
  }
  footer a { color: inherit; text-decoration: none; }
  footer a:hover { color: var(--mist); }
  .hp { position: absolute; left: -9999px; }
</style>
</head>
<body>
<main>
  <div class="lock">
    <svg width="26" height="26" viewBox="0 0 37 37" role="img" aria-label="Chausar mark" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="18" height="18" rx="4.5" fill="#E8EBEE"/>
      <rect x="19" y="19" width="18" height="18" rx="4.5" fill="#46F09B"/>
    </svg>
    <span>chausar</span>
  </div>

  <h1>Decision intelligence for organisations</h1>

  <p class="myth">A kingdom, lost over dice. The lesson outlived the kingdom.</p>

  <p class="status">Built in India<span class="dot">·</span>2026</p>

  <div>
    <p class="field-note">Leave an email. We'll write when there's something to show.</p>
    <form id="capture" action="https://formspree.io/f/mykaevlg" method="POST">
      <input type="email" name="email" placeholder="you@company.com" required aria-label="Email address">
      <input type="text" name="_gotcha" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button type="submit">Notify me</button>
    </form>
    <p class="form-msg" id="form-msg" role="status"></p>
  </div>
</main>

<footer>
  <span>© 2026 Chausar AI · chausar.co.in</span>
  <span>Business enquiries <a href="mailto:info@chausar.co.in">info@chausar.co.in</a></span>
</footer>

<script>
  (function () {
    var form = document.getElementById('capture');
    var msg = document.getElementById('form-msg');
    form.addEventListener('submit', async function (e) {
      e.preventDefault();
      var btn = form.querySelector('button');
      btn.disabled = true;
      msg.textContent = '';
      msg.classList.remove('error');
      try {
        var res = await fetch(form.action, {
          method: 'POST',
          body: new FormData(form),
          headers: { 'Accept': 'application/json' }
        });
        if (res.ok) {
          form.reset();
          msg.textContent = 'Noted. We will be in touch.';
        } else {
          msg.textContent = 'Something went wrong. Write to us instead: info@chausar.co.in';
          msg.classList.add('error');
        }
      } catch (err) {
        msg.textContent = 'Something went wrong. Write to us instead: info@chausar.co.in';
        msg.classList.add('error');
      }
      btn.disabled = false;
    });
  })();
</script>
</body>
</html>
